*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,Arial,sans-serif}
header{background:var(--navy);color:#fff;padding:20px}header div,main{max-width:960px;margin:auto}
main{padding:24px 16px 50px}.panel,.item{background:#fff;border:1px solid #e1e8ed;border-radius:14px;padding:18px;margin:0 0 16px}

.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:600px){.row{grid-template-columns:1fr}}

const adminLanguage=(()=>{try{return localStorage.getItem('ct_language')||'ka'}catch(e){return 'ka'}})();
function translateAdminText(value){
 const dict=ADMIN_LANGUAGES[adminLanguage]||{};
 let result=value;
 for(const [source,target] of Object.entries(dict).sort((a,b)=>b[0].length-a[0].length)) result=result.split(source).join(target);
 return result;
}
function translateAdminPage(){
 document.documentElement.lang=adminLanguage;
 document.documentElement.dir=adminLanguage==='ar'?'rtl':'ltr';
 document.title=translateAdminText('Администратор · Caucasus Transfer');
 const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);
 const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
 nodes.forEach(node=>{const translated=translateAdminText(node.nodeValue);if(translated!==node.nodeValue)node.nodeValue=translated;});
 document.querySelectorAll('[placeholder],[aria-label]').forEach(el=>{
  for(const attr of ['placeholder','aria-label']) if(el.hasAttribute(attr)) el.setAttribute(attr,translateAdminText(el.getAttribute(attr)));
 });
}

const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const $=id=>document.getElementById(id);
translateAdminPage();
new MutationObserver(()=>translateAdminPage()).observe(document.body,{childList:true,subtree:true,characterData:true});
function message(id,text){const el=$(id);el.textContent=text;el.classList.remove('hidden')}
function clearMessage(id){$(id).textContent='';$(id).classList.add('hidden')}
function addText(parent,tag,text){const el=document.createElement(tag);el.textContent=text??'—';parent.appendChild(el);return el}
function addButton(parent,text,cls,handler){const b=document.createElement('button');b.textContent=text;if(cls)b.className=cls;b.addEventListener('click',handler);parent.appendChild(b);return b}
function showDashboard(user){$('loginPanel').classList.add('hidden');$('dashboard').classList.remove('hidden');$('signedInAs').textContent=user.email||'Администратор';}
function showLogin(){ $('dashboard').classList.add('hidden');$('loginPanel').classList.remove('hidden'); }
async function verifyAndShow(user){
 if(!user||user.id!==ADMIN_ID){await client.auth.signOut();showLogin();message('loginMessage','Доступ запрещён: этот аккаунт не является администратором.');return false;}
 clearMessage('loginMessage');showDashboard(user);await refreshAll();return true;
}
$('loginBtn').addEventListener('click',async()=>{
 clearMessage('loginMessage');$('loginBtn').disabled=true;
 const {data,error}=await client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});
 $('loginBtn').disabled=false;
 if(error){message('loginMessage','Не удалось войти: '+error.message);return;}
 await verifyAndShow(data.user);
});
$('logoutBtn').addEventListener('click',async()=>{await client.auth.signOut();showLogin();});
client.auth.getSession().then(({data,error})=>{if(error){message('loginMessage','Не удалось проверить вход: '+error.message);return;}if(data.session?.user)verifyAndShow(data.session.user);else showLogin();});
async function refreshAll(){clearMessage('dashboardMessage');await Promise.all([loadDrivers(),loadOrders()]);}
async function loadDrivers(){
 const box=$('driversList');box.replaceChildren();addText(box,'p','Загружаем анкеты…').className='muted';
 const {data,error}=await client.from('drivers').select('id,name,phone,car,seats,city,status,created_at').order('created_at',{ascending:false});
 box.replaceChildren();if(error){addText(box,'p','Ошибка загрузки: '+error.message).className='empty';return;}
 if(!data.length){addText(box,'p','Пока нет анкет водителей.').className='empty';return;}
 data.forEach(d=>{
  const card=document.createElement('article');card.className='item';
  addText(card,'strong',(d.name||'Без имени')+' · '+(d.status||'без статуса'));
  addText(card,'div','Телефон: '+(d.phone||'—'));addText(card,'div','Автомобиль: '+(d.car||'—')+' · Мест: '+(d.seats||'—'));
  addText(card,'div','Город: '+(d.city||'—'));
  const actions=document.createElement('div');actions.className='actions';card.appendChild(actions);
  addButton(actions,'Подтвердить','',()=>updateDriver(d.id,'approved'));
  addButton(actions,'Отклонить','danger',()=>updateDriver(d.id,'rejected'));
  box.appendChild(card);
 });
}
async function updateDriver(id,status){
 const box=$('dashboardMessage');
 message('dashboardMessage','Сохраняем статус водителя…');
 box.scrollIntoView({behavior:'smooth',block:'center'});
 const {data,error}=await client.from('drivers').update({status}).eq('id',id).select('id,status');
 if(error){
  message('dashboardMessage','Ошибка сохранения статуса: '+error.message);
  return;
 }
 if(!data||data.length===0){
  message('dashboardMessage','Запрос выполнен, но ни одна анкета не обновлена. Проверьте права UPDATE в Supabase.');
  return;
 }
 message('dashboardMessage','Готово! Статус водителя изменён на: '+data[0].status);
 await refreshAll();
 message('dashboardMessage','Готово! Статус водителя изменён на: '+data[0].status);
}
async function loadOrders(){
 const box=$('ordersList');box.replaceChildren();addText(box,'p','Загружаем заказы…').className='muted';
 const [{data:orders,error},{data:drivers, error:driverError}]=await Promise.all([
  client.from('orders').select('id,customer_phone,from_location,to_location,travel_date,travel_time,passengers,vehicle,price,notes,status,assigned_driver_id,created_at').order('created_at',{ascending:false}),
  client.from('drivers').select('id,name,phone,car,status').order('name')
 ]);
 box.replaceChildren();if(error){addText(box,'p','Ошибка загрузки заказов: '+error.message).className='empty';return;}
 if(driverError){addText(box,'p','Не удалось загрузить список водителей: '+driverError.message).className='empty';return;}
 const approvedDrivers=(drivers||[]).filter(d=>String(d.status||'').trim().toLowerCase()==='approved');
 if(!approvedDrivers.length){
  const statuses=(drivers||[]).map(d=>(d.name||'Без имени')+': '+(d.status||'без статуса')).join(' | ');
  addText(box,'p','Подтверждённых водителей найдено: 0. Найдены анкеты: '+(drivers||[]).length+'. Статусы: '+(statuses||'нет анкет')).className='empty';
 } else {
  addText(box,'p','Подтверждённых водителей найдено: '+approvedDrivers.length).className='muted';
 }
 if(!orders.length){addText(box,'p','Пока нет заказов.').className='empty';return;}
 orders.forEach(o=>{
  const card=document.createElement('article');card.className='item';
  addText(card,'strong','Заказ №'+o.id+' · '+(o.status||'новый'));
  addText(card,'div','Маршрут: '+(o.from_location||'—')+' → '+(o.to_location||'—'));
  addText(card,'div','Дата и время: '+(o.travel_date||'—')+' '+(o.travel_time||''));
  addText(card,'div','Клиент: '+(o.customer_phone||'—')+' · Пассажиров: '+(o.passengers??'—'));
  addText(card,'div','Автомобиль: '+(o.vehicle||'—')+' · Цена: '+(o.price??'по согласованию'));
  if(o.notes)addText(card,'div','Пожелания: '+o.notes);
  const row=document.createElement('div');row.className='row';card.appendChild(row);
  const select=document.createElement('select');select.setAttribute('aria-label','Выбрать водителя');
  const first=document.createElement('option');first.value='';first.textContent='Выберите подтверждённого водителя';select.appendChild(first);
  approvedDrivers.forEach(d=>{const opt=document.createElement('option');opt.value=d.id;opt.textContent=d.name+' · '+d.car+' · '+d.phone;if(String(d.id)===String(o.assigned_driver_id))opt.selected=true;select.appendChild(opt);});
  row.appendChild(select);
  const status=document.createElement('select');status.setAttribute('aria-label','Статус заказа');
  [['new','Новый'],['assigned','Назначен водитель'],['completed','Завершён'],['cancelled','Отменён']].forEach(([v,t])=>{const opt=document.createElement('option');opt.value=v;opt.textContent=t;if((o.status||'new')===v)opt.selected=true;status.appendChild(opt);});
  row.appendChild(status);
  addButton(card,'Сохранить заказ','',()=>saveOrder(o.id,select.value,status.value));
  box.appendChild(card);
 });
}
async function saveOrder(id,driverId,status){
 if(!driverId){
  message('dashboardMessage','Сначала выберите подтверждённого водителя.');
  return;
 }
 message('dashboardMessage','Сохраняем назначение водителя и статус заказа…');
 const update={status,assigned_driver_id:Number(driverId)};
 const {data,error}=await client.from('orders').update(update).eq('id',id).select('id,status,assigned_driver_id');
 if(error){
  message('dashboardMessage','Ошибка сохранения заказа: '+error.message);
  return;
 }
 if(!data||data.length===0){
  message('dashboardMessage','Заказ не обновлён. Проверьте права UPDATE для таблицы orders в Supabase.');
  return;
 }
 await refreshAll();
 message('dashboardMessage','Готово! Водитель назначен, статус заказа: '+data[0].status+'.');
}
$('refreshDrivers').addEventListener('click',loadDrivers);
$('refreshOrders').addEventListener('click',loadOrders);
</script>
